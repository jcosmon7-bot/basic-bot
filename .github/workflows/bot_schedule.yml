name: Run ICT Bot

on:
  schedule:
    # Runs every 30 minutes (Approx 48 times a day)
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' # Ensure 3.10 is used

    - name: Install dependencies
      run: |
        pip install pandas yfinance requests

    - name: Run Bot Script
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: python main.py
